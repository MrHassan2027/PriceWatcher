[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "pricewatcher"
version = "1.0.0"
description = "Async price tracker with Discord/email alerts"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3", "beautifulsoup4>=4", "click>=8", "rich>=13"]

[project.scripts]
pricewatcher = "pricewatcher.tracker:main"
